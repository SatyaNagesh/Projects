<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-curve" aria-hidden="true"></div>

<div class="app">

    <header class="header">
        <div class="header-inner">
            <div class="logo-wrap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2C8 2 4 5 4 9c0 2.5 1.5 4.5 3 6l5 7 5-7c1.5-1.5 3-3.5 3-6 0-4-4-7-8-7z"/>
                    <circle cx="12" cy="8" r="2"/>
                </svg>
                <h1>Recipe Finder</h1>
            </div>
            <p class="tagline">Discover meals from around the world</p>
        </div>
    </header>

    <div class="content">

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for a recipe (e.g. pasta, chicken, soup)..."
                    autocomplete="off"
                >
                <button id="search-btn">Search</button>
            </div>

            <div class="category-strip" id="category-strip">
                <button class="cat-btn active" data-cat="">All</button>
                <button class="cat-btn" data-cat="Beef">Beef</button>
                <button class="cat-btn" data-cat="Chicken">Chicken</button>
                <button class="cat-btn" data-cat="Seafood">Seafood</button>
                <button class="cat-btn" data-cat="Vegetarian">Vegetarian</button>
                <button class="cat-btn" data-cat="Pasta">Pasta</button>
                <button class="cat-btn" data-cat="Dessert">Dessert</button>
                <button class="cat-btn" data-cat="Breakfast">Breakfast</button>
                <button class="cat-btn" data-cat="Lamb">Lamb</button>
                <button class="cat-btn" data-cat="Pork">Pork</button>
            </div>
        </div>

        <div id="loading-state" class="state-box hidden">
            <div class="loader">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="spin">
                    <path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
            </div>
            <p>Finding delicious recipes...</p>
        </div>

        <div id="error-state" class="state-box hidden">
            <svg class="state-svg" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8v4M12 16h0"/>
            </svg>
            <p id="error-text">No recipes found. Try a different search.</p>
        </div>

        <div id="results-section" class="results-section hidden">
            <p class="results-count" id="results-count"></p>
            <div class="results-grid" id="results-grid"></div>
        </div>

        <div class="modal-backdrop hidden" id="modal-backdrop">
            <div class="modal" id="modal">
                <button class="modal-close" id="modal-close">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <div class="modal-content" id="modal-content"></div>
            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
