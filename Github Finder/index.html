<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-curve" aria-hidden="true"></div>

<div class="app">

    <header class="header">
        <div class="header-inner">
            <div class="logo-wrap">
                <svg class="gh-logo" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                <h1>GitHub Finder</h1>
            </div>
        </div>
    </header>

    <div class="search-wrap">
        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="Search GitHub users..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="search-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="content">

        <div id="error-state" class="state-box hidden">
            <svg class="state-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8v4M12 16h0"/>
            </svg>
            <p id="error-text">Something went wrong.</p>
        </div>

        <div id="loading-state" class="state-box hidden">
            <div class="spinner"></div>
            <p>Searching GitHub...</p>
        </div>

        <div id="profile-card" class="profile-card hidden">
            <div class="profile-top">
                <img id="avatar" src="" alt="Avatar" class="avatar">
                <div class="profile-info">
                    <h2 id="name" class="name">—</h2>
                    <a id="username-link" href="#" target="_blank" class="username">@username</a>
                    <p id="bio" class="bio hidden"></p>
                    <div id="location-wrap" class="meta-item hidden">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                            <circle cx="12" cy="9" r="2.5"/>
                        </svg>
                        <span id="location"></span>
                    </div>
                    <div id="blog-wrap" class="meta-item hidden">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                        <a id="blog-link" href="#" target="_blank" class="meta-link"></a>
                    </div>
                    <div id="company-wrap" class="meta-item hidden">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path d="M3 21h18M3 10h18M3 7l9-4 9 4M3 10v11M21 10v11"/>
                        </svg>
                        <span id="company"></span>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-num" id="repos">0</span>
                    <span class="stat-label">Repos</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="followers">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="following">0</span>
                    <span class="stat-label">Following</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="gists">0</span>
                    <span class="stat-label">Gists</span>
                </div>
            </div>

            <div class="section-header">
                <h3>Top Repositories</h3>
                <span id="joined" class="joined-date"></span>
            </div>

            <div id="repos-grid" class="repos-grid"></div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
