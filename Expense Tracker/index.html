<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app">

        <header class="header">
            <h1 class="logo">XPNS</h1>
            <p class="tagline">Track every penny</p>
        </header>

        <div class="balance-card">
            <p class="balance-label">Total Balance</p>
            <h2 class="balance-amount" id="balance">₹0.00</h2>
            <div class="balance-split">
                <div class="income-block">
                    <span class="label">Income</span>
                    <span class="amount income-amount" id="total-income">+ ₹0.00</span>
                </div>
                <div class="divider-v"></div>
                <div class="expense-block">
                    <span class="label">Expenses</span>
                    <span class="amount expense-amount" id="total-expense">- ₹0.00</span>
                </div>
            </div>
        </div>

        <div class="main-grid">

            <div class="add-section">
                <h3 class="section-title">Add Transaction</h3>

                <div class="type-toggle">
                    <button class="toggle-btn active" id="income-btn" data-type="income">Income</button>
                    <button class="toggle-btn" id="expense-btn" data-type="expense">Expense</button>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Freelance payment" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="general">General</option>
                        <option value="food">Food & Drinks</option>
                        <option value="transport">Transport</option>
                        <option value="shopping">Shopping</option>
                        <option value="bills">Bills & Utilities</option>
                        <option value="health">Health</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="salary">Salary</option>
                        <option value="freelance">Freelance</option>
                        <option value="investment">Investment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <button class="add-btn" id="add-btn">Add Transaction</button>
                <p class="error-msg" id="error-msg"></p>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <h3 class="section-title">History</h3>
                    <button class="clear-btn" id="clear-btn">Clear All</button>
                </div>

                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="income">Income</button>
                    <button class="filter-btn" data-filter="expense">Expense</button>
                </div>

                <ul class="transaction-list" id="transaction-list">
                    <li class="empty-state">No transactions yet. Add one above!</li>
                </ul>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
